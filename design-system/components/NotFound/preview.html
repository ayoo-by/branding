<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Not found preview</title>
<style>
  body { min-height: 0; }
  /* The frame holds the real section; the caption sits in the section's bottom padding. */
  .demo-frame { position: relative; }
  .demo-cap { position: absolute; left: 0; right: 0; bottom: 1.1rem; text-align: center; }
  .note { font-size: .82rem; color: var(--ink-soft); }
  .note code { font-family: var(--font-mono); font-size: .92em; color: var(--ink); }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="demo-frame">
  <section class="wrap section" style="text-align: center;">
    <p class="eyebrow">Error 404</p>
    <h1 style="font-size: clamp(2.4rem, 7vw, 4rem); margin-top: 0.8rem;">Page not found</h1>
    <p class="lead" style="--d:.1s; margin: 1.25rem auto 0;">This page doesn't exist, or it moved.</p>
    <p style="--d:.2s; margin-top: 1.75rem;">
      <a class="backlink" href="#home"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back home</a>
    </p>
  </section>
  <div class="demo-cap wrap"><p class="note">The <code>h1</code> keeps the base heading colour, <code>ink</code>, not the <code>sage-600</code> of an article title</p></div>
</div>
</body>
</html>
